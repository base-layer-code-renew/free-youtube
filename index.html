<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高機能プレイヤー (ショートカット・URL入力対応)</title>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1c1c1c;
            --accent-color: #ef4444;
            --accent-hover: #dc2626;
            --text-main: #ffffff;
            --text-sub: #a3a3a3;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
        }

        .input-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #111;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #0a0a0a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent-color); }

        .preset-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        button:hover { background-color: #444; }
        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        button.primary:hover { background-color: var(--accent-hover); }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }

        /* 画面右上の操作通知オーバーレイ */
        .shortcut-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.85);
            color: #4ade80;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .shortcut-overlay.show { opacity: 1; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background-color: #111;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .video-grid::-webkit-scrollbar { width: 8px; }
        .video-grid::-webkit-scrollbar-thumb { background-color: #444; border-radius: 4px; }

        .video-card {
            cursor: pointer;
            text-align: left;
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 6px;
            background: #1a1a1a;
        }
        .video-card:hover { transform: translateY(-3px); border-color: var(--accent-color); }
        .video-card.playing { border-color: var(--accent-color); background-color: #331111; }
        .video-card img {
            width: 100%;
            border-radius: 6px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        .video-card .title {
            font-size: 12px;
            margin-top: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #eee;
        }

        .shortcut-guide {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 13px;
            color: var(--text-sub);
            text-align: left;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .key {
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }
        .warning-text {
            color: #fbbf24;
            font-size: 12px;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎮 高機能プレイヤー (ショートカット対応)</h2>

        <!-- 操作説明パネル -->
        <div class="shortcut-guide">
            <strong>【キーボード操作】</strong><br>
            <span class="key">→</span> : 5秒進む　
            <span class="key">←</span> : 5秒戻る　
            <span class="key">↑</span> : 1秒戻る　
            <span class="key">↓</span> : 初めから<br>
            <span class="key">_</span> (アンダーバー) : 1秒進む<br>
            <span class="key">N</span> : 再生位置を記憶 (上書き可能)　
            <span class="key">B</span> : 記憶した位置から再生<br>
            <span class="warning-text">※キーが効かなくなった場合は、動画の外側（黒い背景など）を一度クリックしてください。</span>
        </div>

        <div class="input-panel">
            <div class="input-row">
                <input type="password" id="api-key" placeholder="APIキーを入力 (必須・自動保存されません)" autocomplete="off">
            </div>
            <div class="input-row">
                <input type="text" id="playlist-url" placeholder="プレイリストURL または チャンネルID(UC...) を入力して読み込む">
                <button class="primary" onclick="fetchVideosFromInput()">URLから読込</button>
            </div>
        </div>

        <div class="preset-buttons" id="preset-container">
            <!-- JSでプリセットボタンがここに生成されます -->
        </div>

        <div class="video-wrapper">
            <!-- YouTube IFrame API がこのdivをプレイヤーに置き換えます -->
            <div id="live-player"></div>
            <!-- 通知メッセージ用オーバーレイ -->
            <div id="overlay" class="shortcut-overlay"></div>
        </div>
        
        <div id="status-msg" style="color: #aaa; margin-bottom: 12px; font-size: 13px;">APIキーを入力し、URLを読み込むかボタンを選んでください。</div>
        
        <div id="video-grid" class="video-grid"></div>
    </div>

    <script>
        // プリセットとして登録する再生リストやチャンネル
        const PRESET_PLAYLISTS = [
            { name: "まさのふろつぐ", id: "UUrk3BDRC9xzEFMj9cGly6pQ" },
        ];

        let ytPlayer;           
        let isPlayerReady = false; 
        let activeVideoId = null;
        let savedTime = null;   // Nキーで記憶する時間（秒）
        let overlayTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderPresetButtons();
            loadYouTubeAPI();
        });

        function renderPresetButtons() {
            const container = document.getElementById('preset-container');
            PRESET_PLAYLISTS.forEach(preset => {
                const btn = document.createElement('button');
                btn.textContent = preset.name;
                btn.onclick = () => fetchVideos(preset.id);
                container.appendChild(btn);
            });
        }

        function loadYouTubeAPI() {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('live-player', {
                width: '100%',
                height: '100%',
                videoId: '', 
                playerVars: {
                    'autoplay': 1,
                    'rel': 0,
                    'enablejsapi': 1 
                },
                events: {
                    'onReady': () => { isPlayerReady = true; }
                }
            });
        }

        function fetchVideosFromInput() {
            const inputUrl = document.getElementById('playlist-url').value.trim();
            const playlistId = extractPlaylistId(inputUrl);
            
            if (!playlistId) {
                alert('正しいプレイリストURL、またはチャンネルID（UC...）を入力してください。');
                return;
            }
            fetchVideos(playlistId);
        }

        function extractPlaylistId(input) {
            const match = input.match(/[?&]list=([^&]+)/);
            if (match) return match[1];
            
            if (input.startsWith('UC')) {
                return 'UU' + input.slice(2); 
            }
            if (input.startsWith('UU') || input.startsWith('PL')) {
                return input;
            }
            return null;
        }

        async function fetchVideos(playlistId) {
            const apiKey = document.getElementById('api-key').value.trim();
            const statusMsg = document.getElementById('status-msg');
            const grid = document.getElementById('video-grid');

            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }

            grid.innerHTML = '';
            statusMsg.textContent = '動画を取得中... (100件以上ある場合は少し時間がかかります)';

            try {
                let allItems = [];
                let nextPageToken = '';

                // 次のページがある限りループして全件（100件以上でも）取得する
                do {
                    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${playlistId}&maxResults=50&pageToken=${nextPageToken}&key=${apiKey}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.error) throw new Error(data.error.message);

                    if (data.items) allItems = allItems.concat(data.items);
                    nextPageToken = data.nextPageToken || '';
                } while (nextPageToken);

                const validVideos = allItems.filter(item => {
                    const title = item.snippet.title;
                    const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url;
                    return thumb && title !== 'Private video' && title !== 'Deleted video';
                });

                if (validVideos.length === 0) {
                    statusMsg.textContent = '動画が見つかりませんでした。';
                    return;
                }

                statusMsg.textContent = `全 ${validVideos.length} 件の動画を取得しました！`;
                renderGrid(validVideos);
                
                playVideo(validVideos[0].snippet.resourceId.videoId);

            } catch (err) {
                console.error(err);
                statusMsg.textContent = 'エラーが発生しました。APIキーまたはURLが正しいか確認してください。';
            }
        }

        function renderGrid(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            videos.forEach(item => {
                const videoId = item.snippet.resourceId.videoId;
                const thumb = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url;
                
                const card = document.createElement('div');
                card.className = 'video-card';
                card.dataset.id = videoId;
                card.onclick = () => playVideo(videoId);

                card.innerHTML = `
                    <img src="${thumb}" alt="thumbnail" loading="lazy">
                    <div class="title">${item.snippet.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playVideo(videoId) {
            activeVideoId = videoId;
            
            if (isPlayerReady && ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
            }

            document.querySelectorAll('.video-card').forEach(card => {
                if (card.dataset.id === videoId) {
                    card.classList.add('playing');
                } else {
                    card.classList.remove('playing');
                }
            });
        }

        // キーボード操作リスナー
        document.addEventListener('keydown', (event) => {
            // 入力欄にフォーカスがある場合はショートカットを無効化（文字入力の邪魔をしない）
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
            
            if (!isPlayerReady || !ytPlayer || !ytPlayer.getCurrentTime) return;

            const currentTime = ytPlayer.getCurrentTime();
            let handled = false;

            // event.code を使うことで、日本語入力(IME)がオンでも物理キーとして認識させます
            const code = event.code;
            const key = event.key; // _(アンダーバー)の判定には key を使います

            if (code === 'ArrowRight') {
                ytPlayer.seekTo(currentTime + 5, true);
                showOverlay('▶▶ 5秒進む');
                handled = true;
            } else if (code === 'ArrowLeft') {
                ytPlayer.seekTo(currentTime - 5, true);
                showOverlay('◀◀ 5秒戻る');
                handled = true;
            } else if (code === 'ArrowUp') {
                ytPlayer.seekTo(currentTime - 1, true);
                showOverlay('◀ 1秒戻る');
                handled = true;
            } else if (code === 'ArrowDown') {
                ytPlayer.seekTo(0, true);
                showOverlay('⏮ 初めから');
                handled = true;
            } else if (key === '_') { 
                ytPlayer.seekTo(currentTime + 1, true);
                showOverlay('▶ 1秒進む');
                handled = true;
            } else if (code === 'KeyN') { // Nキー
                savedTime = currentTime; 
                showOverlay(`📌 位置を記憶 (${formatTime(savedTime)})`);
                handled = true;
            } else if (code === 'KeyB') { // Bキー（Mキーの代わり）
                if (savedTime !== null) {
                    ytPlayer.seekTo(savedTime, true);
                    ytPlayer.playVideo(); 
                    showOverlay(`再生再開 (${formatTime(savedTime)})`);
                } else {
                    showOverlay(`⚠️ 記憶された位置がありません`);
                }
                handled = true;
            }

            if (handled) {
                event.preventDefault();
            }
        });

        function showOverlay(text) {
            const overlay = document.getElementById('overlay');
            overlay.textContent = text;
            overlay.classList.add('show');

            if (overlayTimer) clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => {
                overlay.classList.remove('show');
            }, 1500); 
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
